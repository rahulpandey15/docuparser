[project]
name = "docuparser"
version = "0.1.0"
description = "Multimodal (text + image) PDF RAG with ChromaDB and swappable embedding/LLM providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.142.2",
    "openai>=3.23.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
docuparser = "docuparser.cli:app"

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.13",
]
hf = [
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# FastAPI/Typer use call-in-default by design; broad excepts are intentional around model/OCR calls
ignore = ["B008", "BLE001"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
